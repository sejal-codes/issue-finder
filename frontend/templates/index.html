<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unassigned Issue Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header>
    <h1>🔍 Unassigned Issue Finder</h1>
    <p>Find open, unassigned GitHub issues that need help.</p>
  </header>

  <main>
    <form id="search-form">
      <div class="field">
        <label for="labels">Labels (comma-separated)</label>
        <input type="text" id="labels" value="good first issue,help wanted" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="language">Language</label>
          <input type="text" id="language" placeholder="e.g. python" />
        </div>
        <div class="field">
          <label for="days">Created within (days)</label>
          <input type="number" id="days" value="30" min="1" />
        </div>
        <div class="field">
          <label for="min_stars">Min stars</label>
          <input type="number" id="min_stars" value="0" min="0" />
        </div>
      </div>

      <button type="submit">Search</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
